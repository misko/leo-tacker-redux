[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leo-tracker-redux"
version = "0.1.0"
description = "Contract-first capture, analysis, and dashboard pipeline for LEO radio experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
leo-dashboard = "leo_flow.deployments.dashboard_operator:main"
leo-v5-capture = "leo_flow.deployments.v5_capture_operator:main"
leo-v5-dual-capture = "leo_flow.deployments.v5_dual_capture_operator:main"
leo-v5-campaign = "leo_flow.deployments.gauss_v5_campaign_operator:main"
leo-v5-continuous = "leo_flow.deployments.gauss_v5_continuous_operator:main"
leo-gauss-analysis = "leo_station.analysis_operator:main"
leo-verify-release = "leo_flow.deployments.release_verifier:main"
leo-gauss-focused-capture = "leo_flow.deployments.gauss_focused_capture_operator:main"
leo-gauss-focused-analysis = "leo_flow.deployments.gauss_focused_analysis_operator:main"
leo-gauss-focused-continuous = "leo_flow.deployments.gauss_focused_continuous_operator:main"
leo-v5-supercycle-canary = "leo_flow.deployments.gauss_v5_supercycle_canary_operator:main"
leo-gauss-full-dwell = "leo_station.full_dwell_operator:main"
leo-gauss-prompt-full-dwell = "leo_station.full_dwell_timeline_operator:main"
leo-gauss-adaptive-response = "leo_station.adaptive_response_operator:main"
leo-starlink-retro-qam-canary = "leo_flow.deployments.starlink_retro_qam_canary:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "playwright>=1.55",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.12",
]
server = [
  "psycopg[binary]>=3.2",
]
hardware = [
  "pyadi-iio==0.0.21",
]
format = [
  "h5py>=3.14",
  "numpy>=2.3",
]
orbit = [
    "sgp4==2.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leo_flow", "src/leo_station"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "hardware: requires an attached radio or capture host",
  "integration: requires PostgreSQL or external storage",
  "provider: performs a live external provider canary",
]
